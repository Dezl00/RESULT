<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج الثانوية العامة</title>
    <!-- Google Fonts for modern Arabic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Pako library for fast gzip decompression in browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>نتائج الثانوية العامة</h1>
            <p>ابحث عن نتيجتك بسرعة وسهولة</p>
        </header>

        <section class="search-section">
            <div class="search-toggle">
                <input type="radio" id="searchBySeat" name="searchType" value="seat" checked>
                <label for="searchBySeat">رقم الجلوس</label>
                
                <input type="radio" id="searchByName" name="searchType" value="name">
                <label for="searchByName">الاسم</label>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="أدخل رقم الجلوس هنا...">
                <button id="searchBtn" aria-label="بحث">بحث</button>
            </div>
            <div id="errorMessage" class="error-message hidden">الرجاء إدخال بيانات صحيحة للبحث</div>
        </section>

        <section id="resultsContainer" class="results-container hidden">
            <!-- Results will be injected here by app.js -->
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
